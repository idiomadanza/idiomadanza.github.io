[build]
  # Behebt den 404 Fehler: Sagt Netlify, wo die fertige Astro-Seite liegt
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Behebt den Build-Fehler: Zwingt Netlify dazu, Node.js Version 22 (statt 18) zu verwenden
  NODE_VERSION = "22"

# ─── Security Headers ───────────────────────────────────────────
# CSP wird als fester Header ausgeliefert. Astro statisch: Middleware-Header
# erreichen Netlify nicht, deshalb ist netlify.toml hier die Source of Truth.
# Inline-Skripte gibt es nicht mehr (Astro bündelt sie nach /_astro/*.js),
# daher genügt script-src 'self' ohne Nonce/Hashes.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://api.qrserver.com; font-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; frame-src https://www.openstreetmap.org; object-src 'none'; base-uri 'self'; form-action 'self' https://wa.me; frame-ancestors 'none'"

# ─── Cache-Control for static assets (Performance / Web Vitals) ─
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Netlify Functions
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
