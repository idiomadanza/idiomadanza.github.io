[build]
  # Behebt den 404 Fehler: Sagt Netlify, wo die fertige Astro-Seite liegt
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Behebt den Build-Fehler: Zwingt Netlify dazu, Node.js Version 22 (statt 18) zu verwenden
  NODE_VERSION = "22"

# ─── Security Headers ───────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "0"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src https://www.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://wa.me"

# ─── Cache-Control for static assets (Performance / Web Vitals) ─
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
