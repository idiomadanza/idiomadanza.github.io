[build]
  # Behebt den 404 Fehler: Sagt Netlify, wo die fertige Astro-Seite liegt
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Behebt den Build-Fehler: Zwingt Netlify dazu, Node.js Version 22 (statt 18) zu verwenden
  NODE_VERSION = "22"

# ─── Security Headers ───────────────────────────────────────────
# CSP wird dynamisch vom Astro-Middleware mit Nonce generiert.
# Fester CSP-Header hier entfernt – Middleware ist Source of Truth.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), interest-cohort=()"

# ─── Cache-Control for static assets (Performance / Web Vitals) ─
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Netlify Functions
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
