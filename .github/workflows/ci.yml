name: CI

on:
  pull_request:
    branches: [production]
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, Audit & Struktur
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Abhängigkeiten (Lockfile-exakt, ohne Skripte)
        run: npm ci --no-fund --no-audit

      - name: Build
        run: npm run build

      - name: Struktur-Prüfung (dist)
        run: node scripts/ci_check.mjs

      - name: Content-Truth (dist gegen content-facts.json)
        run: node scripts/content_truth.mjs

      - name: Issue-Verknüpfung im PR ("Closes #<n>")
        if: github.event_name == 'pull_request'
        run: node scripts/ci_pr_link.mjs

      - name: Dependency-Audit (High/Critical, blockierend)
        run: npm audit --audit-level=high
